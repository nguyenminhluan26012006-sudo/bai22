<h2>Gửi tin nhắn</h2>
<form id="contactForm">
<input type="text" id="name" placeholder="Tên của bạn" required style="width:100%; padding:0.75rem; margin:0.5rem 0; border:1px solid #ccc; border-radius:6px;">
<input type="email" id="email" placeholder="Email của bạn" required style="width:100%; padding:0.75rem; margin:0.5rem 0; border:1px solid #ccc; border-radius:6px;">
<textarea id="message" placeholder="Nội dung tin nhắn..." rows="5" required style="width:100%; padding:0.75rem; margin:0.5rem 0; border:1px solid #ccc; border-radius:6px; font-family:inherit;"></textarea>
<button type="submit" style="background:#333; color:white; padding:0.75rem 2rem; border:none; border-radius:6px; cursor:pointer; font-size:1rem;">Gửi</button>
</form>
</section>
